<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>返利机器人 · 控制台</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #f4f7fb;
      --bg-subtle: #eef2f7;
      --surface: #ffffff;
      --border: #e5eaf0;
      --border-light: #f0f3f7;
      --text: #1e293b;
      --text-secondary: #475569;
      --muted: #94a3b8;
      --primary: #10b981;
      --primary-dark: #059669;
      --primary-light: #ecfdf5;
      --primary-soft: #d1fae5;
      --info: #3b82f6;
      --info-light: #eff6ff;
      --warning: #f59e0b;
      --warning-light: #fffbeb;
      --danger: #ef4444;
      --danger-light: #fef2f2;
      --success: #10b981;
      --success-light: #ecfdf5;
      --radius: 10px;
      --radius-sm: 8px;
      --shadow-sm: 0 1px 2px rgba(15, 23, 42, 0.04);
      --shadow: 0 1px 3px rgba(15, 23, 42, 0.06), 0 4px 14px rgba(15, 23, 42, 0.04);
      --shadow-md: 0 4px 20px rgba(15, 23, 42, 0.08);
      --font-body: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
      --font-mono: ui-monospace, "SF Mono", "Cascadia Code", monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font-body);
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }

    .hidden { display: none !important; }

    .panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow-sm);
    }

    /* ── 登录 ── */
    .login-wrap {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: linear-gradient(160deg, #ecfdf5 0%, var(--bg) 45%, #eff6ff 100%);
    }
    .login-card {
      width: 100%;
      max-width: 400px;
      padding: 36px 32px;
      animation: fadeUp 0.4s ease;
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: none; }
    }
    .login-logo {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 24px;
    }
    .login-logo .hex {
      width: 48px;
      height: 48px;
      background: linear-gradient(135deg, var(--primary), #34d399);
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 14px rgba(16, 185, 129, 0.25);
    }
    .login-logo .hex svg { width: 24px; height: 24px; fill: #fff; }
    .login-logo-text h1 {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--text);
    }
    .login-logo-text p {
      font-size: 0.8rem;
      color: var(--muted);
      margin-top: 2px;
    }
    .login-card .subtitle {
      color: var(--text-secondary);
      font-size: 0.9rem;
      margin-bottom: 24px;
    }
    label {
      display: block;
      font-size: 0.875rem;
      font-weight: 500;
      color: var(--text-secondary);
      margin-bottom: 6px;
    }
    input, select, textarea {
      width: 100%;
      padding: 10px 14px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      font-size: 0.9rem;
      font-family: var(--font-body);
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    input::placeholder { color: var(--muted); }
    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.15);
    }
    select option { background: var(--surface); }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 9px 16px;
      border: none;
      border-radius: var(--radius-sm);
      font-size: 0.875rem;
      font-family: var(--font-body);
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s;
    }
    .btn:disabled { opacity: 0.45; cursor: not-allowed; }
    .btn-primary {
      background: var(--primary);
      color: #fff;
    }
    .btn-primary:hover:not(:disabled) {
      background: var(--primary-dark);
      box-shadow: 0 2px 8px rgba(16, 185, 129, 0.3);
    }
    .login-card .btn-primary { width: 100%; margin-top: 8px; padding: 11px; }
    .btn-sm { padding: 7px 14px; font-size: 0.8125rem; }
    .btn-success {
      background: var(--success-light);
      color: var(--primary-dark);
      border: 1px solid var(--primary-soft);
    }
    .btn-success:hover { background: var(--primary-soft); }
    .btn-danger {
      background: var(--danger-light);
      color: var(--danger);
      border: 1px solid #fecaca;
    }
    .btn-danger:hover { background: #fee2e2; }
    .btn-ghost {
      background: var(--surface);
      color: var(--text-secondary);
      border: 1px solid var(--border);
    }
    .btn-ghost:hover:not(:disabled) {
      color: var(--primary-dark);
      border-color: var(--primary-soft);
      background: var(--primary-light);
    }
    .error-msg {
      color: var(--danger);
      font-size: 0.85rem;
      margin-top: 12px;
      min-height: 1.2em;
    }

    /* ── 布局 ── */
    .layout { display: flex; min-height: 100vh; }
    .sidebar {
      width: 220px;
      background: var(--surface);
      border-right: 1px solid var(--border);
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      box-shadow: var(--shadow-sm);
    }
    .sidebar-header {
      padding: 22px 18px;
      border-bottom: 1px solid var(--border-light);
    }
    .brand { display: flex; align-items: center; gap: 10px; }
    .brand-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--primary);
      flex-shrink: 0;
    }
    .brand-name {
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--text);
    }
    .brand-sub {
      font-size: 0.75rem;
      color: var(--muted);
      margin-top: 2px;
    }
    .nav-section { padding: 14px 10px; flex: 1; }
    .nav-label {
      font-size: 0.75rem;
      color: var(--muted);
      padding: 0 10px 8px;
      font-weight: 500;
    }
    .nav-item {
      display: flex;
      align-items: center;
      gap: 8px;
      width: 100%;
      text-align: left;
      padding: 10px 12px;
      border: none;
      background: transparent;
      color: var(--text-secondary);
      border-radius: var(--radius-sm);
      cursor: pointer;
      font-size: 0.875rem;
      margin-bottom: 2px;
      transition: all 0.15s;
      font-family: var(--font-body);
    }
    .nav-item .nav-icon { display: none; }
    .nav-item:hover {
      color: var(--text);
      background: var(--bg-subtle);
    }
    .nav-item.active {
      color: var(--primary-dark);
      background: var(--primary-light);
      font-weight: 600;
    }
    .sidebar-footer {
      padding: 14px;
      border-top: 1px solid var(--border-light);
    }

    .main {
      flex: 1;
      padding: 28px 32px;
      overflow-x: auto;
      background: var(--bg);
    }
    .page-header {
      margin-bottom: 20px;
    }
    .page-header h2 {
      font-size: 1.35rem;
      font-weight: 700;
      color: var(--text);
    }
    .page-header .page-desc {
      font-size: 0.875rem;
      color: var(--muted);
      margin-top: 4px;
    }

    /* ── 统计卡片 ── */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 14px;
      margin-bottom: 20px;
    }
    .stat-card {
      padding: 18px 20px;
      border-radius: var(--radius);
      transition: box-shadow 0.2s, transform 0.2s;
    }
    .stat-card:hover { box-shadow: var(--shadow); }
    .stat-card .stat-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }
    .stat-card .label {
      font-size: 0.8125rem;
      color: var(--muted);
      font-weight: 500;
    }
    .stat-card .stat-icon {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1rem;
    }
    .stat-card .value {
      font-size: 1.65rem;
      font-weight: 700;
      color: var(--text);
      line-height: 1.2;
    }
    .stat-card .stat-bar { display: none; }
    .stat-card.cyan .stat-icon { background: var(--info-light); color: var(--info); }
    .stat-card.purple .stat-icon { background: #f5f3ff; color: #8b5cf6; }
    .stat-card.green .stat-icon { background: var(--success-light); color: var(--primary); }
    .stat-card.warn .stat-icon { background: var(--warning-light); color: var(--warning); }
    .stat-card.warn .value { color: #d97706; }
    .stat-card-clickable { cursor: pointer; }
    .stat-card-clickable:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-md);
    }
    .stat-card-clickable .jump-hint {
      font-size: 0.75rem;
      color: var(--warning);
      margin-top: 8px;
    }

    .dash-actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 8px;
      padding: 14px 16px;
    }

    /* ── 工具栏 & 表格 ── */
    .toolbar {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 14px;
      align-items: center;
      padding: 14px 16px;
    }
    .toolbar input, .toolbar select { width: auto; min-width: 160px; }
    .toolbar .toolbar-divider {
      width: 1px;
      height: 28px;
      background: var(--border);
      margin: 0 2px;
    }

    .table-wrap { border-radius: var(--radius); overflow: hidden; }
    .table-scroll { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 0.875rem; }
    th, td {
      padding: 12px 16px;
      text-align: left;
      border-bottom: 1px solid var(--border-light);
      white-space: nowrap;
    }
    th {
      font-size: 0.8125rem;
      color: var(--text-secondary);
      font-weight: 600;
      background: var(--bg-subtle);
      position: sticky;
      top: 0;
    }
    tbody tr:hover td { background: #fafbfc; }
    tbody tr:last-child td { border-bottom: none; }
    td.mono {
      font-family: var(--font-mono);
      font-size: 0.8125rem;
      color: var(--text-secondary);
    }
    .cell-wrap {
      max-width: 200px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-family: var(--font-mono);
      font-size: 0.8125rem;
      color: var(--text-secondary);
    }
    .link-wxid {
      color: var(--primary-dark) !important;
      cursor: pointer;
      text-decoration: none;
      font-weight: 500;
    }
    .link-wxid:hover { text-decoration: underline; }

    .badge {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 500;
    }
    .badge-pending { background: var(--warning-light); color: #b45309; }
    .badge-completed, .badge-settled, .badge-active, .badge-paid {
      background: var(--success-light); color: var(--primary-dark);
    }
    .badge-rejected, .badge-failed, .badge-banned {
      background: var(--danger-light); color: var(--danger);
    }

    .actions { display: flex; gap: 6px; }
    .pagination {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 14px;
      color: var(--muted);
      font-size: 0.8125rem;
    }
    .pagination-btns { display: flex; gap: 8px; }
    .empty {
      text-align: center;
      padding: 48px;
      color: var(--muted);
      font-size: 0.875rem;
    }

    /* ── 弹窗 ── */
    .modal {
      position: fixed;
      inset: 0;
      z-index: 300;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .modal-backdrop {
      position: absolute;
      inset: 0;
      background: rgba(15, 23, 42, 0.35);
      backdrop-filter: blur(2px);
    }
    .modal-panel {
      position: relative;
      width: min(920px, 100%);
      max-height: 90vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      border-radius: var(--radius);
      box-shadow: var(--shadow-md);
    }
    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
      padding: 20px 24px;
      border-bottom: 1px solid var(--border-light);
      background: var(--surface);
    }
    .modal-header h3 {
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--text);
    }
    .modal-sub {
      font-size: 0.8125rem;
      color: var(--muted);
      margin-top: 4px;
      word-break: break-all;
      font-family: var(--font-mono);
    }
    .modal-body {
      overflow-y: auto;
      padding: 20px 24px 24px;
      background: var(--surface);
    }
    .user-stats-row {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
      gap: 10px;
      margin-bottom: 18px;
    }
    .user-stat-mini {
      padding: 12px 14px;
      border: 1px solid var(--border-light);
      border-radius: var(--radius-sm);
      background: var(--bg);
    }
    .user-stat-mini .k { font-size: 0.75rem; color: var(--muted); }
    .user-stat-mini .v { font-size: 1rem; font-weight: 600; margin-top: 4px; color: var(--text); }
    .detail-section { margin-top: 18px; }
    .detail-section h4 {
      font-size: 0.875rem;
      font-weight: 600;
      color: var(--text-secondary);
      margin-bottom: 10px;
    }
    .detail-table-wrap {
      overflow-x: auto;
      border: 1px solid var(--border-light);
      border-radius: var(--radius-sm);
    }
    .detail-table-wrap table { font-size: 0.8125rem; }
    .detail-table-wrap th, .detail-table-wrap td { padding: 8px 12px; }

    /* ── 系统配置 ── */
    .settings-layout { display: grid; grid-template-columns: 240px 1fr; gap: 16px; align-items: start; }
    .settings-nav {
      display: flex;
      flex-direction: column;
      gap: 2px;
      position: sticky;
      top: 0;
      padding: 6px;
      max-height: calc(100vh - 120px);
      overflow-y: auto;
    }
    .settings-tree-folder { margin-bottom: 2px; }
    .settings-tree-folder-btn {
      display: flex;
      align-items: center;
      gap: 6px;
      width: 100%;
      text-align: left;
      padding: 8px 10px;
      border: none;
      background: transparent;
      color: var(--text);
      border-radius: var(--radius-sm);
      cursor: pointer;
      font-size: 0.8125rem;
      font-weight: 600;
      font-family: var(--font-body);
      transition: background 0.15s;
    }
    .settings-tree-folder-btn:hover { background: var(--bg-subtle); }
    .settings-tree-chevron {
      display: inline-block;
      width: 14px;
      font-size: 0.625rem;
      color: var(--muted);
      transition: transform 0.15s;
      flex-shrink: 0;
    }
    .settings-tree-folder.expanded > .settings-tree-folder-btn .settings-tree-chevron {
      transform: rotate(90deg);
    }
    .settings-tree-children {
      display: none;
      padding-left: 8px;
      margin-left: 6px;
      border-left: 1px solid var(--border-light);
    }
    .settings-tree-folder.expanded > .settings-tree-children { display: block; }
    .settings-nav-btn {
      display: block;
      width: 100%;
      text-align: left;
      padding: 7px 10px 7px 12px;
      border: none;
      background: transparent;
      color: var(--text-secondary);
      border-radius: var(--radius-sm);
      cursor: pointer;
      font-size: 0.8125rem;
      font-family: var(--font-body);
      transition: all 0.15s;
    }
    .settings-nav-btn:hover { background: var(--bg-subtle); color: var(--text); }
    .settings-nav-btn.active {
      color: var(--primary-dark);
      background: var(--primary-light);
      font-weight: 600;
    }
    .settings-tree-leaf .settings-nav-btn { font-weight: 400; }
    .settings-panel { min-height: 400px; padding: 20px; }
    .settings-section-title {
      font-size: 1rem;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 4px;
    }
    .settings-section-desc {
      font-size: 0.8125rem;
      color: var(--muted);
      margin-bottom: 18px;
    }
    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 14px;
      margin-bottom: 18px;
    }
    .form-field label { margin-bottom: 6px; }
    .form-field .field-hint {
      font-size: 0.75rem;
      color: var(--muted);
      margin-top: 4px;
    }
    .form-field-wide { grid-column: 1 / -1; }
    textarea {
      min-height: 88px;
      resize: vertical;
      font-family: var(--font-mono);
      font-size: 0.8125rem;
    }
    .toggle-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 14px;
      border: 1px solid var(--border-light);
      border-radius: var(--radius-sm);
      background: var(--bg);
    }
    .toggle-row input[type="checkbox"] {
      width: auto;
      accent-color: var(--primary);
    }
    .settings-actions {
      display: flex;
      gap: 10px;
      padding-top: 12px;
      border-top: 1px solid var(--border-light);
    }
    .pwd-card {
      margin-top: 20px;
      padding: 20px;
    }
    .pwd-card h3 {
      font-size: 0.95rem;
      font-weight: 700;
      margin-bottom: 14px;
      color: var(--text);
    }

    .toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      padding: 12px 18px;
      border-radius: var(--radius-sm);
      background: var(--surface);
      border: 1px solid var(--border);
      box-shadow: var(--shadow-md);
      z-index: 200;
      max-width: 360px;
      font-size: 0.875rem;
      animation: toastIn 0.25s ease;
    }
    .toast.success { border-color: var(--primary-soft); background: var(--primary-light); color: var(--primary-dark); }
    .toast.error { border-color: #fecaca; background: var(--danger-light); color: var(--danger); }
    @keyframes toastIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: none; }
    }

    @media (max-width: 768px) {
      .layout { flex-direction: column; }
      .sidebar { width: 100%; min-height: auto; border-right: none; border-bottom: 1px solid var(--border); }
      .nav-section { display: flex; flex-wrap: wrap; gap: 4px; padding: 10px; }
      .nav-label, .sidebar-footer { display: none; }
      .nav-item { width: auto; flex: 1; min-width: 72px; justify-content: center; font-size: 0.8125rem; }
      .main { padding: 18px 14px; }
      .settings-layout { grid-template-columns: 1fr; }
      .settings-nav { flex-direction: row; flex-wrap: wrap; position: static; }
    }
  </style>
</head>
<body>
  <div id="loginView" class="login-wrap hidden">
    <div class="login-card panel">
      <div class="login-logo">
        <div class="hex">
          <svg viewBox="0 0 24 24"><path d="M12 2L2 7v10l10 5 10-5V7L12 2zm0 2.2l7.5 3.75v7.5L12 19.8l-7.5-3.75v-7.5L12 4.2zM12 8a4 4 0 100 8 4 4 0 000-8z"/></svg>
        </div>
        <div class="login-logo-text">
          <h1>返利控制台</h1>
          <p>v2.0 · wxauto</p>
        </div>
      </div>
      <p class="subtitle">返利机器人控制台 · 数据管理与提现审核</p>
      <form id="loginForm">
        <label for="password">登录密码</label>
        <input id="password" type="password" placeholder="输入管理密码..." autocomplete="current-password" required />
        <button type="submit" class="btn btn-primary">登录</button>
        <div id="loginError" class="error-msg"></div>
      </form>
    </div>
  </div>

  <div id="appView" class="layout hidden">
    <aside class="sidebar">
      <div class="sidebar-header">
        <div class="brand">
          <div class="brand-dot"></div>
          <div>
            <div class="brand-name">返利控制台</div>
            <div class="brand-sub">系统运行中</div>
          </div>
        </div>
      </div>
      <div class="nav-section">
        <div class="nav-label">导航</div>
        <button class="nav-item active" data-tab="dashboard"><span class="nav-icon">01</span>数据概览</button>
        <button class="nav-item" data-tab="users"><span class="nav-icon">02</span>用户管理</button>
        <button class="nav-item" data-tab="orders"><span class="nav-icon">03</span>订单管理</button>
        <button class="nav-item" data-tab="withdrawals"><span class="nav-icon">04</span>提现审核</button>
        <button class="nav-item" data-tab="transactions"><span class="nav-icon">05</span>资金流水</button>
        <button class="nav-item" data-tab="checkins"><span class="nav-icon">06</span>签到记录</button>

      <section id="tab-users" class="tab-panel hidden">
        <div class="page-header">

        <div class="toolbar panel">
          <select id="ordersStatus">
            <option value="">全部状态</option>
            <option value="pending">待确认</option>
            <option value="paid">已付款</option>
            <option value="settled">已结算</option>
            <option value="failed">已失效</option>

          <input id="ordersWxid" placeholder="按微信号筛选" />
          <button class="btn btn-primary btn-sm" id="ordersFilterBtn">筛选</button>

        <div class="toolbar panel">
          <select id="withdrawalsStatus">
            <option value="all">全部状态</option>
            <option value="pending">待审核</option>
            <option value="completed">已完成</option>
            <option value="rejected">已拒绝</option>
          </select>
          <button class="btn btn-primary btn-sm" id="withdrawalsFilterBtn">筛选</button>
        </div>
        <div class="table-wrap panel"><div class="table-scroll"><table><thead id="withdrawalsHead"></thead><tbody id="withdrawalsBody"></tbody></table></div></div>
        <div class="pagination" id="withdrawalsPager"></div>
      </section>

      <section id="tab-transactions" class="tab-panel hidden">
        <div class="page-header">
          <h2>资金流水</h2>
          <div class="page-desc">余额变动记录</div>

        <div class="toolbar panel">
          <input id="txWxid" placeholder="按微信号筛选" />
          <button class="btn btn-primary btn-sm" id="txFilterBtn">筛选</button>
        </div>
        <div class="table-wrap panel"><div class="table-scroll"><table><thead id="txHead"></thead><tbody id="txBody"></tbody></table></div></div>
        <div class="pagination" id="txPager"></div>
      </section>

      <section id="tab-checkins" class="tab-panel hidden">
        <div class="page-header">
          <h2>签到记录</h2>
          <div class="page-desc">用户每日签到</div>
        </div>
        <div class="toolbar panel">
          <input id="checkinsWxid" placeholder="按微信号筛选" />
          <button class="btn btn-primary btn-sm" id="checkinsFilterBtn">筛选</button>
        </div>
        <div class="table-wrap panel"><div class="table-scroll"><table><thead id="checkinsHead"></thead><tbody id="checkinsBody"></tbody></table></div></div>
        <div class="pagination" id="checkinsPager"></div>

      <section id="tab-settings" class="tab-panel hidden">
        <div class="page-header">
          <h2>系统配置</h2>
        </div>
        <div class="settings-layout">
          <div class="settings-nav panel" id="settingsNav"></div>
          <div class="settings-panel panel" id="settingsPanel">
            <div class="empty">加载配置...</div>
          </div>
        </div>
        <div class="pwd-card panel">
          <h3>修改登录密码</h3>
          <div class="form-grid">
            <div class="form-field">
              <label for="pwdOld">当前密码</label>
              <input id="pwdOld" type="password" autocomplete="current-password" />
            </div>
            <div class="form-field">
              <label for="pwdNew">新密码</label>
              <input id="pwdNew" type="password" autocomplete="new-password" />
            </div>
          </div>
          <button class="btn btn-primary btn-sm" id="pwdChangeBtn">更新登录密码</button>
        </div>

  <div id="userModal" class="modal hidden">
    <div class="modal-backdrop" onclick="closeUserDetail()"></div>
    <div class="modal-panel panel">
      <div class="modal-header">
        <div>
          <h3>用户详情</h3>
          <div class="modal-sub" id="userModalWxid">—</div>
        </div>
        <button class="btn btn-ghost btn-sm" onclick="closeUserDetail()">关闭</button>
      </div>
      <div class="modal-body" id="userModalBody">
        <div class="empty">加载中...</div>
      </div>
    </div>
  </div>

  <script>
    const state = {
      tab: 'dashboard',
      pages: { users: 1, orders: 1, withdrawals: 1, transactions: 1, checkins: 1 },
      limit: 20,
      settingsSchema: [],
      settingsTree: [],
      settingsExpanded: {},
      settingsValues: {},
      settingsSection: null,
      maskPlaceholder: '__UNCHANGED__',
    };

    async function api(path, options = {}) {
      const res = await fetch(path, {
        credentials: 'same-origin',
        headers: { 'Content-Type': 'application/json', ...(options.headers || {}) },
        ...options,
      });
      if (res.status === 401) {
        showLogin();
        throw new Error('未登录');
      }
      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        throw new Error(err.detail || res.statusText);
      }
      return res.json();
    }

    function showToast(msg, type = 'success') {
      const el = document.createElement('div');
      el.className = `toast ${type}`;
      el.textContent = msg;
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 3500);
    }

    function fmtMoney(v) {
      const n = Number(v);
      return Number.isFinite(n) ? '¥' + n.toFixed(2) : '-';
    }

    function fmtTime(v) {
      if (!v) return '-';
      return String(v).replace('T', ' ').slice(0, 19);
    }

    const ORDER_STATUS_LABELS = {
      pending: '待确认',
      paid: '已付款',
      settled: '已结算',
      failed: '已失效',
    };
    const WITHDRAW_STATUS_LABELS = {
      pending: '待审核',
      completed: '已完成',
      rejected: '已拒绝',
    };
    const USER_STATUS_LABELS = {
      active: '正常',
      banned: '已封禁',
    };
    const TX_TYPE_LABELS = {
      rebate: '返利',
      withdraw: '提现',
      refund: '退款',
      checkin: '签到',
    };

    function statusLabel(status, kind) {
      const s = (status || '').toLowerCase();
      const maps = {
        order: ORDER_STATUS_LABELS,
        withdrawal: WITHDRAW_STATUS_LABELS,
        user: USER_STATUS_LABELS,
        transaction: TX_TYPE_LABELS,
      };
      const merged = { ...ORDER_STATUS_LABELS, ...WITHDRAW_STATUS_LABELS, ...USER_STATUS_LABELS, ...TX_TYPE_LABELS };
      const label = (kind && maps[kind]?.[s]) || merged[s];
      return label || status || '-';
    }

    function statusBadge(status, kind) {
      const s = (status || '').toLowerCase();
      const cls = {
        pending: 'badge-pending',
        completed: 'badge-completed',
        settled: 'badge-settled',
        active: 'badge-active',
        rejected: 'badge-rejected',
        failed: 'badge-failed',
        paid: 'badge-paid',
        banned: 'badge-banned',
        rebate: 'badge-settled',
        withdraw: 'badge-pending',
        refund: 'badge-paid',
        checkin: 'badge-completed',
      }[s] || '';
      return `<span class="badge ${cls}">${statusLabel(status, kind)}</span>`;
    }

    function statCard(label, value, icon, colorClass, opts = {}) {
      const id = opts.id ? ` id="${opts.id}"` : '';
      const clickable = opts.clickable ? ' stat-card-clickable' : '';
      const hint = opts.hint ? `<div class="jump-hint">${opts.hint}</div>` : '';
      return `<div class="stat-card panel ${colorClass}${clickable}"${id}>
        <div class="stat-top">
          <div class="label">${label}</div>
          <div class="stat-icon">${icon}</div>
        </div>
        <div class="value">${value}</div>
        <div class="stat-bar"></div>${hint}
      </div>`;
    }

    function wxidCell(wxid) {
      const safe = (wxid || '').replace(/"/g, '&quot;');
      return `<td class="cell-wrap link-wxid" data-wxid="${safe}" onclick="openUserDetail(this.dataset.wxid)">${wxid}</td>`;
    }

    function miniTable(columns, rows, rowHtml) {
      if (!rows.length) return '<div class="empty" style="padding:24px">暂无数据</div>';
      return `<div class="detail-table-wrap"><table><thead><tr>${columns.map(c => `<th>${c}</th>`).join('')}</tr></thead><tbody>${rows.map(rowHtml).join('')}</tbody></table></div>`;
    }

    function goPendingWithdrawals() {
      document.getElementById('withdrawalsStatus').value = 'pending';
      switchTab('withdrawals');
    }

    async function syncAllianceOrders(btn) {
      const el = btn || document.getElementById('ordersSyncBtn');
      if (el) { el.disabled = true; el.dataset.orig = el.textContent; el.textContent = '同步中...'; }
      try {
        const res = await api('/admin/api/orders/sync', { method: 'POST', body: '{}' });
        showToast(res.message, res.success ? 'success' : 'error');
        if (res.success) {
          loadDashboard();
          if (state.tab === 'orders') loadOrders(state.pages.orders);
        }
      } catch (err) {
        showToast(err.message, 'error');
      } finally {
        if (el) { el.disabled = false; el.textContent = el.dataset.orig || '同步联盟订单'; }
      }
    }

    async function settleOrderByNo() {
      const orderNo = document.getElementById('settleOrderNo').value.trim();
      if (!orderNo) {
        showToast('请输入订单号', 'error');
        return;
      }
      if (!confirm(`确认手动结算订单 ${orderNo.toUpperCase()}？`)) return;
      try {
        const res = await api('/admin/api/orders/settle', {
          method: 'POST',
          body: JSON.stringify({ order_no: orderNo }),
        });
        showToast(res.message, res.success ? 'success' : 'error');
        if (res.success) {
          document.getElementById('settleOrderNo').value = '';
          loadDashboard();
          loadOrders(state.pages.orders);
        }
      } catch (err) {
        showToast(err.message, 'error');
      }
    }

    async function openUserDetail(wxid) {
      if (!wxid) return;
      document.getElementById('userModal').classList.remove('hidden');
      document.getElementById('userModalWxid').textContent = wxid;
      document.getElementById('userModalBody').innerHTML = '<div class="empty">加载中...</div>';
      try {
        const data = await api('/admin/api/users/' + encodeURIComponent(wxid));
        if (!data.success) {
          document.getElementById('userModalBody').innerHTML = `<div class="empty">${data.message || '加载失败'}</div>`;
          return;
        }
        const u = data.user;
        const cs = data.checkin_stats || {};
        document.getElementById('userModalBody').innerHTML = `
          <div class="user-stats-row">
            <div class="user-stat-mini"><div class="k">昵称</div><div class="v">${u.nickname || '—'}</div></div>
            <div class="user-stat-mini"><div class="k">余额</div><div class="v">${fmtMoney(u.balance)}</div></div>
            <div class="user-stat-mini"><div class="k">累计收益</div><div class="v">${fmtMoney(u.total_earnings)}</div></div>
            <div class="user-stat-mini"><div class="k">订单数</div><div class="v">${u.total_orders ?? 0}</div></div>
            <div class="user-stat-mini"><div class="k">状态</div><div class="v">${statusBadge(u.status, 'user')}</div></div>
            <div class="user-stat-mini"><div class="k">签到次数</div><div class="v">${cs.total_checkins ?? 0}</div></div>
            <div class="user-stat-mini"><div class="k">签到奖励</div><div class="v">${fmtMoney(cs.total_reward)}</div></div>
            <div class="user-stat-mini"><div class="k">连续签到</div><div class="v">${cs.continuous_days ?? 0} 天</div></div>
          </div>
          <div class="detail-section"><h4>订单 (${data.orders.total})</h4>
            ${miniTable(['订单号', '平台', '返利', '状态', '时间'], data.orders.items, r => `<tr>
              <td class="cell-wrap">${r.order_no}</td><td>${r.platform}</td><td>${fmtMoney(r.user_rebate)}</td>
              <td>${statusBadge(r.order_status, 'order')}</td><td>${fmtTime(r.created_at)}</td></tr>`)}
          </div>
          <div class="detail-section"><h4>提现记录 (${data.withdrawals.total})</h4>
            ${miniTable(['编号', '金额', '状态', '时间'], data.withdrawals.items, r => `<tr>
              <td>${r.id}</td><td>${fmtMoney(r.amount)}</td><td>${statusBadge(r.status, 'withdrawal')}</td><td>${fmtTime(r.created_at)}</td></tr>`)}
          </div>
          <div class="detail-section"><h4>资金流水 (${data.transactions.total})</h4>
            ${miniTable(['类型', '金额', '余额', '描述', '时间'], data.transactions.items, r => `<tr>
              <td>${statusLabel(r.type, 'transaction')}</td><td>${fmtMoney(r.amount)}</td><td>${fmtMoney(r.balance_after)}</td>
              <td class="cell-wrap">${r.description || '—'}</td><td>${fmtTime(r.created_at)}</td></tr>`)}
          </div>
          <div class="detail-section"><h4>签到 (${data.checkins.total})</h4>
            ${miniTable(['日期', '奖励', '连续天数', '时间'], data.checkins.items, r => `<tr>
              <td>${r.checkin_date}</td><td>${fmtMoney(r.reward_amount)}</td><td>${r.continuous_days}</td><td>${fmtTime(r.created_at)}</td></tr>`)}
          </div>`;
      } catch (err) {
        document.getElementById('userModalBody').innerHTML = `<div class="empty">${err.message}</div>`;
      }
    }

    function closeUserDetail() {
      document.getElementById('userModal').classList.add('hidden');
    }

    window.openUserDetail = openUserDetail;
    window.closeUserDetail = closeUserDetail;

    function renderPager(containerId, page, total, onPage) {
      const totalPages = Math.max(1, Math.ceil(total / state.limit));
      const el = document.getElementById(containerId);
      el.innerHTML = `
        <span>共 ${total} 条 · 第 ${page}/${totalPages} 页</span>
        <div class="pagination-btns">
          <button class="btn btn-ghost btn-sm" ${page <= 1 ? 'disabled' : ''} data-p="${page - 1}">上一页</button>
          <button class="btn btn-ghost btn-sm" ${page >= totalPages ? 'disabled' : ''} data-p="${page + 1}">下一页</button>
        </div>`;
      el.querySelectorAll('[data-p]').forEach(btn => {
        btn.addEventListener('click', () => onPage(Number(btn.dataset.p)));
      });
    }

    function renderTable(headId, bodyId, columns, rows, rowHtml) {
      document.getElementById(headId).innerHTML =
        '<tr>' + columns.map(c => `<th>${c}</th>`).join('') + '</tr>';
      const body = document.getElementById(bodyId);
      if (!rows.length) {
        body.innerHTML = `<tr><td colspan="${columns.length}" class="empty">暂无数据</td></tr>`;
        return;
      }
      body.innerHTML = rows.map(rowHtml).join('');
    }

    async function checkAuth() {
      const me = await api('/admin/api/me');
      if (me.authenticated) {
        showApp();
        loadDashboard();
      } else {
        showLogin();
      }
    }

    function showLogin() {
      document.getElementById('loginView').classList.remove('hidden');
      document.getElementById('appView').classList.add('hidden');
    }

    function showApp() {
      document.getElementById('loginView').classList.add('hidden');
      document.getElementById('appView').classList.remove('hidden');
    }

    document.getElementById('loginForm').addEventListener('submit', async e => {
      e.preventDefault();
      const password = document.getElementById('password').value;
      const errEl = document.getElementById('loginError');
      errEl.textContent = '';
      try {
        const res = await api('/admin/api/login', {
          method: 'POST',
          body: JSON.stringify({ password }),
        });
        if (!res.success) {
          errEl.textContent = '✕ ' + (res.message || '授权失败');
          return;
        }
        showApp();
        loadDashboard();
      } catch (err) {
        errEl.textContent = '✕ ' + err.message;
      }
    });

    document.getElementById('logoutBtn').addEventListener('click', async () => {
      await api('/admin/api/logout', { method: 'POST' });
      showLogin();
    });

    document.querySelectorAll('.nav-item[data-tab]').forEach(btn => {
      btn.addEventListener('click', () => switchTab(btn.dataset.tab));
    });

    function switchTab(tab) {
      state.tab = tab;
      document.querySelectorAll('.nav-item[data-tab]').forEach(b => {
        b.classList.toggle('active', b.dataset.tab === tab);
      });
      document.querySelectorAll('.tab-panel').forEach(p => p.classList.add('hidden'));
      document.getElementById('tab-' + tab).classList.remove('hidden');
      if (tab === 'dashboard') loadDashboard();
      if (tab === 'users') loadUsers();
      if (tab === 'orders') loadOrders();
      if (tab === 'withdrawals') loadWithdrawals();
      if (tab === 'transactions') loadTransactions();
      if (tab === 'checkins') loadCheckins();
      if (tab === 'settings') loadSettings();
    }

    async function loadSettings() {
      try {
        const [schemaRes, valuesRes] = await Promise.all([
          api('/admin/api/settings/schema'),
          api('/admin/api/settings'),
        ]);
        state.settingsSchema = schemaRes.sections || [];
        state.settingsTree = schemaRes.tree || [];
        state.settingsValues = valuesRes.values || {};
        state.maskPlaceholder = valuesRes.mask_placeholder || '__UNCHANGED__';
        if (!state.settingsSection && state.settingsSchema.length) {
          state.settingsSection = state.settingsSchema[0].id;
        }
        ensureSettingsExpanded(state.settingsSection);
        renderSettingsNav();
        renderSettingsForm();
      } catch (err) {
        showToast(err.message, 'error');
      }
    }

    const DEFAULT_SETTINGS_EXPANDED = ['rebate', 'platform', 'system'];

    function ensureSettingsExpanded(sectionId) {
      if (!state.settingsExpanded || typeof state.settingsExpanded !== 'object') {
        state.settingsExpanded = {};
      }
      for (const id of DEFAULT_SETTINGS_EXPANDED) {
        state.settingsExpanded[id] = true;
      }
      if (!sectionId || !state.settingsTree?.length) return;
      const path = findSettingsFolderPath(state.settingsTree, sectionId, []);
      if (!path) return;
      for (const folderId of path) {
        state.settingsExpanded[folderId] = true;
      }
    }

    function findSettingsFolderPath(nodes, sectionId, path) {
      for (const node of nodes || []) {
        if (node.type === 'section' && node.section_id === sectionId) {
          return path;
        }
        if (node.type === 'folder') {
          const found = findSettingsFolderPath(node.children, sectionId, [...path, node.id]);
          if (found) return found;
        }
      }
      return null;
    }

    function renderSettingsTreeNode(node) {
      if (node.type === 'section') {
        const sid = node.section_id;
        const active = sid === state.settingsSection;
        return `<div class="settings-tree-leaf">
          <button type="button" class="settings-nav-btn ${active ? 'active' : ''}" data-sid="${sid}">${node.title}</button>
        </div>`;
      }
      if (node.type === 'folder') {
        const expanded = !!state.settingsExpanded[node.id];
        const childHtml = (node.children || []).map(renderSettingsTreeNode).join('');
        return `<div class="settings-tree-folder ${expanded ? 'expanded' : ''}" data-fid="${node.id}">
          <button type="button" class="settings-tree-folder-btn" data-toggle-fid="${node.id}">
            <span class="settings-tree-chevron">▶</span>
            <span>${node.title}</span>
          </button>
          <div class="settings-tree-children">${childHtml}</div>
        </div>`;
      }
      return '';
    }

    function renderSettingsNav() {
      const nav = document.getElementById('settingsNav');
      if (!state.settingsTree?.length) {
        nav.innerHTML = (state.settingsSchema || []).map(s => `
          <button type="button" class="settings-nav-btn ${s.id === state.settingsSection ? 'active' : ''}"
            data-sid="${s.id}">${s.title}</button>
        `).join('');
      } else {
        nav.innerHTML = state.settingsTree.map(renderSettingsTreeNode).join('');
      }
      nav.querySelectorAll('[data-toggle-fid]').forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          const fid = btn.dataset.toggleFid;
          state.settingsExpanded[fid] = !state.settingsExpanded[fid];
          renderSettingsNav();
        });
      });
      nav.querySelectorAll('[data-sid]').forEach(btn => {
        btn.addEventListener('click', () => {
          state.settingsSection = btn.dataset.sid;
          ensureSettingsExpanded(state.settingsSection);
          renderSettingsNav();
          renderSettingsForm();
        });
      });
    }

    function renderFieldInput(field, value) {
      const id = `cfg_${field.key}`;
      const hint = field.hint ? `<div class="field-hint">${field.hint}</div>` : '';
      if (field.type === 'bool') {
        const checked = value === true || value === 'true';
        return `<div class="form-field form-field-wide">
          <div class="toggle-row">
            <input type="checkbox" id="${id}" ${checked ? 'checked' : ''} />
            <label for="${id}" style="margin:0;text-transform:none;letter-spacing:0;color:var(--text);font-family:var(--font-body);">${field.label}</label>
          </div>${hint}
        </div>`;
      }
      if (field.type === 'json') {
        return `<div class="form-field form-field-wide">
          <label for="${id}">${field.label}</label>
          <textarea id="${id}">${value ?? ''}</textarea>${hint}
        </div>`;
      }
      if (field.type === 'secret') {
        const ph = value === state.maskPlaceholder ? '留空则不修改' : '';
        return `<div class="form-field">
          <label for="${id}">${field.label}</label>
          <input id="${id}" type="password" placeholder="${ph || '密钥'}" value="" autocomplete="off" />${hint}
        </div>`;
      }
      const inputType = field.type === 'float' || field.type === 'int' ? 'number' : 'text';
      const stepAny = field.step === 'any';
      const step = field.step != null ? (stepAny ? ' step="any"' : ` step="${field.step}"`) : '';
      const min = field.min != null && !stepAny ? ` min="${field.min}"` : '';
      const max = field.max != null ? ` max="${field.max}"` : '';
      return `<div class="form-field">
        <label for="${id}">${field.label}</label>
        <input id="${id}" type="${inputType}" value="${value ?? ''}"${step}${min}${max} />${hint}
      </div>`;
    }

    function renderSettingsForm() {
      const section = state.settingsSchema.find(s => s.id === state.settingsSection);
      const panel = document.getElementById('settingsPanel');
      if (!section) {
        panel.innerHTML = '<div class="empty">暂无配置分组</div>';
        return;
      }
      const values = state.settingsValues[section.id] || {};
      panel.innerHTML = `
        <div class="settings-section-title">${section.title}</div>
        <div class="settings-section-desc">${section.description || ''}</div>
        <form id="settingsForm" class="form-grid">
          ${section.fields.map(f => renderFieldInput(f, values[f.key])).join('')}
        </form>
        <div class="settings-actions">
          <button type="button" class="btn btn-primary btn-sm" id="settingsSaveBtn">保存此分组</button>
        </div>`;
      document.getElementById('settingsSaveBtn').addEventListener('click', () => saveSettingsSection(section));
    }

    function collectSettingsValues(section) {
      const out = {};
      for (const field of section.fields) {
        const el = document.getElementById(`cfg_${field.key}`);
        if (!el) continue;
        if (field.type === 'bool') {
          out[field.key] = el.checked;
        } else if (field.type === 'secret') {
          if (el.value.trim()) out[field.key] = el.value.trim();
        } else if (field.type === 'json') {
          out[field.key] = el.value;
        } else if (field.type === 'int' || field.type === 'float') {
          if (el.value === '') {
            out[field.key] = '';
          } else if (field.type === 'float') {
            out[field.key] = parseFloat(el.value);
          } else {
            out[field.key] = parseInt(el.value, 10);
          }
        } else {
          out[field.key] = el.value;
        }
      }
      return out;
    }

    async function saveSettingsSection(section) {
      try {
        const res = await api(`/admin/api/settings/${section.id}`, {
          method: 'PUT',
          body: JSON.stringify({ values: collectSettingsValues(section) }),
        });
        showToast(res.message, res.success ? 'success' : 'error');
        if (res.success) await loadSettings();
      } catch (err) {
        showToast(err.message, 'error');
      }
    }

    document.getElementById('pwdChangeBtn').addEventListener('click', async () => {
      const old_password = document.getElementById('pwdOld').value;
      const new_password = document.getElementById('pwdNew').value;
      if (!old_password || !new_password) {
        showToast('请填写当前密码和新密码', 'error');
        return;
      }
      try {
        const res = await api('/admin/api/settings/change-password', {
          method: 'POST',
          body: JSON.stringify({ old_password, new_password }),
        });
        showToast(res.message, res.success ? 'success' : 'error');
        if (res.success) {
          document.getElementById('pwdOld').value = '';
          document.getElementById('pwdNew').value = '';
        }
      } catch (err) {
        showToast(err.message, 'error');
      }
    });

    async function loadDashboard() {
      const data = await api('/admin/api/dashboard');
      document.getElementById('statsGrid').innerHTML = [
        statCard('活跃用户', data.total_users, '👤', 'cyan'),
        statCard('订单总数', data.total_orders, '📦', 'purple'),
        statCard('累计佣金', fmtMoney(data.total_commission), '💰', 'green'),
        statCard('待审核提现', data.pending_withdrawals, '⏳', 'warn', {
          id: 'statPendingWithdraw',
          clickable: true,
          hint: '点击进入审核',
        }),
        statCard('用户余额合计', fmtMoney(data.total_user_balance), '💳', 'cyan'),
      ].join('');
      document.getElementById('statPendingWithdraw')?.addEventListener('click', goPendingWithdrawals);
    }

    async function loadUsers(page = state.pages.users) {
      state.pages.users = page;
      const q = document.getElementById('usersSearch').value.trim();
      const params = new URLSearchParams({ page, limit: state.limit });
      if (q) params.set('q', q);
      const data = await api('/admin/api/users?' + params);
      renderTable('usersHead', 'usersBody',
        ['编号', '微信号', '昵称', '余额', '累计收益', '订单数', '状态', '注册时间'],
        data.items,
        r => `<tr>
          <td class="mono">${r.id}</td>
          ${wxidCell(r.wxid)}
          <td>${r.nickname || '—'}</td>
          <td class="mono">${fmtMoney(r.balance)}</td>
          <td class="mono">${fmtMoney(r.total_earnings)}</td>
          <td class="mono">${r.total_orders ?? 0}</td>
          <td>${statusBadge(r.status, 'user')}</td>
          <td class="mono">${fmtTime(r.created_at)}</td>
        </tr>`);
      renderPager('usersPager', page, data.total, loadUsers);
    }

    async function loadOrders(page = state.pages.orders) {
      state.pages.orders = page;
      const status = document.getElementById('ordersStatus').value;
      const wxid = document.getElementById('ordersWxid').value.trim();
      const params = new URLSearchParams({ page, limit: state.limit });
      if (status) params.set('status', status);
      if (wxid) params.set('wxid', wxid);
      const data = await api('/admin/api/orders?' + params);
      renderTable('ordersHead', 'ordersBody',
        ['订单号', '微信号', '平台', '商品', '返利', '状态', '联盟单号', '创建时间'],
        data.items,
        r => `<tr>
          <td class="cell-wrap" title="${r.order_no}">${r.order_no}</td>
          ${wxidCell(r.wxid)}
          <td class="mono">${r.platform}</td>
          <td class="cell-wrap" title="${r.product_title || ''}">${r.product_title || '—'}</td>
          <td class="mono">${fmtMoney(r.user_rebate)}</td>
          <td>${statusBadge(r.order_status, 'order')}</td>
          <td class="cell-wrap">${r.platform_order_id || '—'}</td>
          <td class="mono">${fmtTime(r.created_at)}</td>
        </tr>`);
      renderPager('ordersPager', page, data.total, loadOrders);
    }

    async function approveWithdraw(id) {
      if (!confirm(`确认通过提现 #${id}？\n请确保已完成线下转账。`)) return;
      try {
        const res = await api(`/admin/api/withdrawals/${id}/approve`, {
          method: 'POST',
          body: JSON.stringify({ remark: '管理员已线下转账' }),
        });
        showToast(res.message, res.success ? 'success' : 'error');
        loadWithdrawals(state.pages.withdrawals);
        if (state.tab === 'dashboard') loadDashboard();
      } catch (err) {
        showToast(err.message, 'error');
      }
    }

    async function rejectWithdraw(id) {
      const reason = prompt('请输入拒绝原因（将退回用户余额）:', '不符合提现条件');
      if (reason === null) return;
      try {
        const res = await api(`/admin/api/withdrawals/${id}/reject`, {
          method: 'POST',
          body: JSON.stringify({ reason: reason || '管理员拒绝' }),
        });
        showToast(res.message, res.success ? 'success' : 'error');
        loadWithdrawals(state.pages.withdrawals);
        if (state.tab === 'dashboard') loadDashboard();
      } catch (err) {
        showToast(err.message, 'error');
      }
    }

    async function loadWithdrawals(page = state.pages.withdrawals) {
      state.pages.withdrawals = page;
      const status = document.getElementById('withdrawalsStatus').value;
      const params = new URLSearchParams({ page, limit: state.limit, status });
      const data = await api('/admin/api/withdrawals?' + params);
      renderTable('withdrawalsHead', 'withdrawalsBody',
        ['编号', '微信号', '金额', '状态', '收款方式', '收款账号', '备注', '申请时间', '操作'],
        data.items,
        r => {
          const actions = r.status === 'pending'
            ? `<div class="actions">
                <button class="btn btn-success btn-sm" onclick="approveWithdraw(${r.id})">通过</button>
                <button class="btn btn-danger btn-sm" onclick="rejectWithdraw(${r.id})">驳回</button>
              </div>`
            : '<span class="mono">—</span>';
          return `<tr>
            <td class="mono">${r.id}</td>
            ${wxidCell(r.wxid)}
            <td class="mono">${fmtMoney(r.amount)}</td>
            <td>${statusBadge(r.status, 'withdrawal')}</td>
            <td class="cell-wrap">${r.payment_account || '—'}</td>
            <td class="cell-wrap">${r.remark || '—'}</td>
            <td class="mono">${fmtTime(r.created_at)}</td>
            <td>${actions}</td>
          </tr>`;
        });
      renderPager('withdrawalsPager', page, data.total, loadWithdrawals);
    }

    async function loadTransactions(page = state.pages.transactions) {
      state.pages.transactions = page;
      const wxid = document.getElementById('txWxid').value.trim();
      const params = new URLSearchParams({ page, limit: state.limit });
      if (wxid) params.set('wxid', wxid);
      const data = await api('/admin/api/transactions?' + params);
      renderTable('txHead', 'txBody',
        ['编号', '微信号', '类型', '金额', '余额后', '描述', '关联订单', '时间'],
        data.items,
        r => `<tr>
          <td class="mono">${r.id}</td>
          ${wxidCell(r.wxid)}
          <td class="mono">${statusLabel(r.type, 'transaction')}</td>
          <td class="mono">${fmtMoney(r.amount)}</td>
          <td class="mono">${fmtMoney(r.balance_after)}</td>
          <td class="cell-wrap" title="${r.description || ''}">${r.description || '—'}</td>
          <td class="cell-wrap">${r.related_order_no || '—'}</td>
          <td class="mono">${fmtTime(r.created_at)}</td>
        </tr>`);
      renderPager('txPager', page, data.total, loadTransactions);
    }

    async function loadCheckins(page = state.pages.checkins) {
      state.pages.checkins = page;
      const wxid = document.getElementById('checkinsWxid').value.trim();
      const params = new URLSearchParams({ page, limit: state.limit });
      if (wxid) params.set('wxid', wxid);
      const data = await api('/admin/api/checkins?' + params);
      renderTable('checkinsHead', 'checkinsBody',
        ['编号', '微信号', '签到日期', '奖励', '连续天数', '时间'],
        data.items,
        r => `<tr>
          <td class="mono">${r.id}</td>
          ${wxidCell(r.wxid)}
          <td class="mono">${r.checkin_date}</td>
          <td class="mono">${fmtMoney(r.reward_amount)}</td>
          <td class="mono">${r.continuous_days}</td>
          <td class="mono">${fmtTime(r.created_at)}</td>
        </tr>`);
      renderPager('checkinsPager', page, data.total, loadCheckins);
    }

    window.approveWithdraw = approveWithdraw;
    window.rejectWithdraw = rejectWithdraw;

    document.getElementById('usersSearchBtn').addEventListener('click', () => loadUsers(1));
    document.getElementById('ordersFilterBtn').addEventListener('click', () => loadOrders(1));
    document.getElementById('withdrawalsFilterBtn').addEventListener('click', () => loadWithdrawals(1));
    document.getElementById('txFilterBtn').addEventListener('click', () => loadTransactions(1));
    document.getElementById('checkinsFilterBtn').addEventListener('click', () => loadCheckins(1));
    document.getElementById('dashSyncBtn').addEventListener('click', e => syncAllianceOrders(e.target));
    document.getElementById('dashPendingBtn').addEventListener('click', goPendingWithdrawals);
    document.getElementById('ordersSyncBtn').addEventListener('click', e => syncAllianceOrders(e.target));
    document.getElementById('settleOrderBtn').addEventListener('click', settleOrderByNo);
    document.getElementById('settleOrderNo').addEventListener('keydown', e => {
      if (e.key === 'Enter') settleOrderByNo();
    });

    checkAuth().catch(showLogin);
  </script>
</body>
</html>
